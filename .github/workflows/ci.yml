name: CI

on:
   push:
permissions:
   contents: read

jobs:
   test:
      runs-on: ubuntu-latest
      steps:
         - name: Check out repository
           uses: actions/checkout@v4
         - name: Set up Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 24
         - name: Run lint
           run: npm run lint
         - name: Run tests
           run: npm test
